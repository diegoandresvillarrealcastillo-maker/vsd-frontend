# Las cabeceras de seguridad de la imagen del frontend (S-05 de la auditoria 360).
#
# Son las MISMAS que `vercel.json` manda en PRE y PROD. Hay un script que lo
# comprueba al compilar (`scripts/comprobar-las-cabeceras.mjs`): si alguien cambia
# una y no la otra, la compilacion falla. Esta imagen solo existe para el entorno
# completo y para el CI, pero lo que se prueba aqui tiene que ser lo que sale.
#
# Se carga con `include` desde `default.conf`, en el `server` y en cada `location`
# que declara sus propias cabeceras: en nginx, un `add_header` dentro de un
# `location` BORRA los del nivel de arriba, asi que sin repetirlo un archivo con
# `Cache-Control` saldria sin ninguna de estas.
#
# `always` hace que salgan tambien en las respuestas de error (404, 500).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Esta imagen nunca es publica (es el entorno completo local y el CI), asi que
# nunca se indexa. En Vercel la cabecera solo sale en los `*.vercel.app`, es decir
# en PRE y en las vistas previas, y por eso NO entra en la comprobacion de que las
# dos copias digan lo mismo (SEO-02).
add_header X-Robots-Tag "noindex, nofollow" always;

# En modo "solo informar" a proposito: se ve que romperia sin romper nada. Una
# semana asi en PRE, mirando la consola del navegador, y despues se pasa a
# `Content-Security-Policy` con el mismo valor.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-gk8Rv076O0Rm2lTznkmwV5q9fCINxpdDZkKVId5KMeQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://esm.sh; connect-src 'self' https://*.onrender.com https://*.supabase.co https://esm.sh; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
