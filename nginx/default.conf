# La configuracion del servidor de la imagen del frontend (SCRUM-132).
#
# Reproduce lo que hoy hace Vercel con `vercel.json` (todas las rutas a
# `index.html`, salvo los archivos que existen), y agrega lo que Vercel decide
# solo: que se guarda en cache y que no.
#
# Este archivo se carga dentro de `http {}` de la imagen oficial, de modo que
# aqui va un `server {}` y nada mas.

# Texto comprimido. Las imagenes y el PDF ya vienen comprimidos y no se tocan.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types
  text/plain
  text/css
  text/xml
  application/javascript
  application/json
  application/manifest+json
  image/svg+xml;

server {
  # Solo IPv4, a proposito: si el anfitrion no tuviera IPv6, un `listen [::]`
  # haria que nginx no arrancara. Docker publica el puerto en IPv4 de todas
  # formas.
  listen 8080;
  server_name _;

  # No decir que version de nginx es: no le sirve a nadie mas que a quien busca
  # una vulnerabilidad concreta.
  server_tokens off;

  # Las cabeceras de seguridad (S-05). Ver el archivo: hay que repetirlas en cada
  # location que declare las suyas.
  include /etc/nginx/cabeceras-de-seguridad.conf;

  root /usr/share/nginx/html;
  index index.html;

  # Para el HEALTHCHECK de la imagen. No es una ruta de la aplicacion.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Lo que cambia en cada version y NUNCA se guarda sin preguntar.
  #
  # `index.html` nombra los archivos con hash de la version vigente: si un
  # navegador guardara uno viejo, pediria archivos que ya no existen. Con
  # `no-cache` guarda copia pero la valida en cada visita (es una peticion
  # corta: responde 304 si no cambio).
  #
  # `sw.js` igual, y con mas razon: es lo que decide que version corre una
  # aplicacion instalada. Un service worker viejo en cache es una aplicacion que
  # nunca se actualiza.
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/cabeceras-de-seguridad.conf;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/cabeceras-de-seguridad.conf;
  }

  # El manifiesto, con su tipo declarado aqui y no heredado de la tabla de tipos
  # de nginx: si esa tabla no lo trajera, el tipo seria `octet-stream` y la
  # instalacion de la PWA fallaria sin avisar. El `types {}` vacio vale solo para
  # este bloque: vaciarlo en `server` quitaria el tipo de todo lo demas.
  location = /manifest.webmanifest {
    types {}
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/cabeceras-de-seguridad.conf;
  }

  # Los archivos de la compilacion llevan el hash de su contenido en el nombre:
  # si cambian, cambia el nombre. Se pueden guardar un ano sin riesgo.
  #
  # Y si uno NO existe, es un 404 de verdad. Sin esta linea caeria en el
  # `try_files` de abajo y devolveria `index.html` con un 200: el navegador
  # recibiria HTML donde esperaba JavaScript y el error seria un "Unexpected
  # token '<'" que nadie sabe leer.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/cabeceras-de-seguridad.conf;
    try_files $uri =404;
  }

  # Las pantallas de la aplicacion (SEO-02). Solo las que existen: lo mismo que
  # las reescrituras de `vercel.json`, y hay una prueba (`scripts/rutas-del-
  # hospedaje.spec.ts`) que comprueba que las dos cubren cada ruta de `rutas.ts` y
  # que ninguna deja pasar una direccion inventada. Se reescribe a `index.html` y
  # no se sirve desde aqui, para que el bloque de `index.html` de arriba le ponga
  # su `no-cache`.
  location ~ ^/(acceso|registro|recuperar|contrasena-nueva|completa-tu-registro|solo-mayores|privacidad|terminos|cookies|panel|perfil|diario)/?$ {
    rewrite ^ /index.html last;
  }

  location ~ ^/(modulo|actividad)/[^/]+/?$ {
    rewrite ^ /index.html last;
  }

  # Todo lo demas: el archivo si existe (iconos, PDF, imagenes, robots.txt) y, si no,
  # un 404 de verdad. Antes caia en `index.html` con un 200: cualquier direccion
  # inventada parecia una pagina, y a Google eso le parece un "soft 404".
  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;

  location = /404.html {
    internal;
    add_header Cache-Control "no-cache";
    include /etc/nginx/cabeceras-de-seguridad.conf;
  }
}
