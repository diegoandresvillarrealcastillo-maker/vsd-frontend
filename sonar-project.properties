# La clave del proyecto y la organizacion las pone el CI (variables SONAR_PROJECT_KEY y
# SONAR_ORGANIZATION de GitHub). SCRUM-277.
sonar.projectName=VSD Health Frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src,scripts
sonar.tests=src,scripts

sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.spec.mjs
sonar.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.spec.mjs,**/node_modules/**,**/coverage/**,**/dist/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/pruebas/**

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
