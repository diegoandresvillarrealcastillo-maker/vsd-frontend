# La clave del proyecto y la organizacion las pone el CI (variables SONAR_PROJECT_KEY y
# SONAR_ORGANIZATION de GitHub). SCRUM-277.
sonar.projectName=VSD Health Frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src,scripts
sonar.tests=src,scripts

sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.spec.mjs
sonar.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.spec.mjs,**/node_modules/**,**/coverage/**,**/dist/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/pruebas/**

# Avisos que se ignoran a proposito (SCRUM-281). Cada uno se reviso en el codigo y no es un defecto;
# ignorarlos deja la nota reflejando el codigo real.
#  - S2871: se ordenan nombres de cabeceras HTTP para compararlos entre Vercel y nginx: texto simple en
#    el que el orden por defecto es el correcto.
#  - S4036: los scripts de scripts/ llaman a git y npm. Los corre una persona o el CI, no un usuario.
#  - S1523 y S3403: scripts/comprobar-el-service-worker.mjs prueba el service worker ya compilado dentro
#    de una caja aislada (node:vm), con codigo nuestro y sin datos de usuarios. Sonar deduce mal el tipo
#    de lo que devuelve la caja y cree que las comparaciones son siempre falsas; si lo fueran, el script
#    fallaria, porque comprobar() anota un fallo cada vez que la condicion da falso.
#  - S4822: enPromesa convierte los fallos inmediatos del ejecutor en una promesa rechazada. El rechazo
#    de la promesa que devuelve le llega a quien la llama; ese es el diseno.
#  - S8786: expresiones regulares de peor caso lento que solo quitan saltos de linea o barras sobre
#    texto propio o de la propia persona en su navegador. Se midio con 5.000 y 20.000 repeticiones: menos
#    de 35 ms. Los scripts de scripts/ procesan archivos nuestros.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S2871
sonar.issue.ignore.multicriteria.e1.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e2.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S1523
sonar.issue.ignore.multicriteria.e3.resourceKey=scripts/comprobar-el-service-worker.mjs
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S3403
sonar.issue.ignore.multicriteria.e4.resourceKey=scripts/comprobar-el-service-worker.mjs
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S4822
sonar.issue.ignore.multicriteria.e5.resourceKey=src/sincronizacion/ejecutores.ts
sonar.issue.ignore.multicriteria.e6.ruleKey=javascript:S8786
sonar.issue.ignore.multicriteria.e6.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.e7.resourceKey=src/analitica/plantillaDeRuta.ts
sonar.issue.ignore.multicriteria.e8.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.e8.resourceKey=src/sincronizacion/textoDeLoEscrito.ts
sonar.issue.ignore.multicriteria.e9.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.e9.resourceKey=src/infraestructura/entorno.ts

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
