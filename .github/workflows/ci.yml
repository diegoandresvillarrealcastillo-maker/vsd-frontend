# ============================================================
#  VSD Health - Integracion continua
# ============================================================
#  Primera barrera automatica del proyecto. Cubre cuatro cosas:
#
#    1. que no entre ningun secreto al repositorio;
#    2. que todo commit siga Conventional Commits y cite su ticket;
#    3. estilo, formato y tipos;
#    4. que las pruebas pasen y la aplicacion compile.
#
#  El trabajo de calidad empezo a ejecutarse con SCRUM-71, que es
#  cuando el repositorio dejo de tener solo documentacion.
# ============================================================

name: CI

on:
  pull_request:
    branches: [desarrollo, preproduccion, produccion]
  push:
    branches: [desarrollo, preproduccion, produccion]

# Principio de minimo privilegio: el CI solo necesita leer el codigo.
permissions:
  contents: read

# Si se empuja dos veces seguidas, la ejecucion anterior se cancela.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.30.1'
  COMMITLINT_VERSION: '21.2.2'

jobs:
  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el codigo con el historial completo
        uses: actions/checkout@v7
        with:
          # Gitleaks revisa todos los commits, no solo el ultimo:
          # un secreto borrado despues sigue estando en el historial.
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --silent --show-error --fail --location "$url" --output gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      - name: Buscar secretos en todo el historial
        # --redact evita que el secreto encontrado quede impreso en el
        # registro del trabajo, que seria una segunda filtracion.
        run: gitleaks git . --redact --no-banner --verbose

  commits:
    name: Convencion de commits
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Descargar el codigo con el historial completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Instalar commitlint
        run: |
          npm install --no-save --no-audit --no-fund \
            "@commitlint/cli@${COMMITLINT_VERSION}" \
            "@commitlint/config-conventional@${COMMITLINT_VERSION}"

      - name: Validar los mensajes de commit del Pull Request
        env:
          # Se pasan por variable de entorno y no interpoladas dentro del
          # script, para no inyectar contenido del evento en la shell.
          COMMIT_DESDE: ${{ github.event.pull_request.base.sha }}
          COMMIT_HASTA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$COMMIT_DESDE" --to "$COMMIT_HASTA" --verbose

  calidad:
    name: Calidad del codigo
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        # npm ci respeta package-lock.json al pie de la letra: el CI instala
        # exactamente las mismas versiones que hay en el equipo.
        run: npm ci

      - name: Revisar el estilo
        run: npm run lint

      - name: Revisar el formato
        run: npm run format:check

      - name: Revisar los tipos
        run: npm run typecheck

      - name: Ejecutar las pruebas con cobertura
        # Todavia sin umbral minimo: se fija en SCRUM-73, cuando exista logica
        # que merezca cubrirse. El umbral vive en vite.config.ts.
        run: npm run test:coverage

      - name: Compilar
        run: npm run build

  imagen:
    name: Imagen de Docker
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Construir la imagen
        # No se pasa ninguna VITE_*: la pagina se sirve igual, y las credenciales
        # de Supabase solo se piden cuando alguien se autentica.
        run: docker build --tag vsd-web:ci .

      - name: Imprimir el peso y revisar que no se haya disparado
        run: |
          set -euo pipefail
          bytes="$(docker image inspect vsd-web:ci --format '{{.Size}}')"
          mb=$((bytes / 1024 / 1024))
          echo "La imagen pesa ${mb} MB."
          # Alarma contra accidentes (que entren node_modules o mapas de fuente),
          # no una meta. Se ajusta con el numero real que imprime esta linea.
          limite=200
          if [ "$mb" -gt "$limite" ]; then
            echo "::error::La imagen pesa ${mb} MB y el limite de alarma es ${limite} MB."
            exit 1
          fi

      - name: Arrancarla y esperar a que este sana
        run: |
          set -euo pipefail
          docker run --detach --name web --publish 8080:8080 vsd-web:ci

          # Esperar al HEALTHCHECK de la imagen comprueba tambien que ese
          # comando funciona, que de otro modo nadie ejecuta.
          for intento in $(seq 1 24); do
            estado="$(docker inspect --format '{{.State.Health.Status}}' web)"
            echo "intento ${intento}: ${estado}"
            if [ "$estado" = "healthy" ]; then
              break
            fi
            sleep 5
          done

          if [ "$estado" != "healthy" ]; then
            docker logs web
            echo "::error::La imagen no llego a estado healthy."
            exit 1
          fi

      - name: Comprobar que sirve la aplicacion como lo hace Vercel
        run: |
          set -euo pipefail
          base=http://localhost:8080

          codigo() { curl --silent --output /dev/null --write-out '%{http_code}' "$@"; }
          cabecera() { curl --silent --show-error --fail --head "$@"; }

          echo "La raiz es la aplicacion"
          curl --silent --show-error --fail "$base/" | grep -q 'id="raiz"'

          echo "Una ruta interna devuelve la aplicacion, no un 404 (recargar /panel)"
          test "$(codigo "$base/panel")" = "200"
          curl --silent --show-error --fail "$base/panel" | grep -q 'id="raiz"'

          echo "Un archivo de la compilacion que no existe es un 404 de verdad"
          test "$(codigo "$base/assets/no-existe.js")" = "404"

          echo "Los archivos que existen se sirven tal cual, con su tipo (icono, SVG)"
          test "$(codigo "$base/icono-192.png")" = "200"
          cabecera "$base/icono-192.png" | grep -i '^content-type: image/png'
          cabecera "$base/favicon.svg" | grep -i '^content-type: image/svg+xml'

          echo "index.html y sw.js nunca se usan sin validar"
          cabecera "$base/index.html" | grep -i '^cache-control:.*no-cache'
          cabecera "$base/sw.js" | grep -i '^cache-control:.*no-cache'

          echo "El manifiesto, con su tipo"
          cabecera "$base/manifest.webmanifest" | grep -i '^content-type: application/manifest+json'

          echo "Los archivos con hash se guardan un ano, y comprimidos"
          js="$(curl --silent --show-error --fail "$base/" | grep -o '/assets/[^"]*\.js' | awk 'NR==1')"
          test -n "$js"
          echo "  usando $js"
          cabecera "$base$js" | grep -i '^cache-control:.*immutable'
          curl --silent --show-error --fail --head -H 'Accept-Encoding: gzip' "$base$js" | grep -i '^content-encoding: gzip'

          echo "No dice que version de nginx es"
          if cabecera "$base/" | grep -i '^server: .*[0-9]'; then
            echo "::error::La cabecera Server revela la version."
            exit 1
          fi

      - name: Revisar la imagen por dentro
        run: |
          set -euo pipefail
          usuario="$(docker exec web id -u)"
          echo "Corre con el usuario ${usuario}"
          test "$usuario" != "0"

          # Ni configuracion ni codigo fuente ni herramientas de desarrollo.
          docker exec web sh -c 'test ! -e /usr/share/nginx/html/.env'
          docker exec web sh -c 'test ! -d /usr/share/nginx/html/src'
          docker exec web sh -c 'test ! -d /usr/share/nginx/html/node_modules'

          # La raiz publicada es de solo lectura para quien corre el proceso.
          if docker exec web sh -c 'touch /usr/share/nginx/html/escribir-aqui 2>/dev/null'; then
            echo "::error::El proceso pudo escribir en la carpeta publicada."
            exit 1
          fi

      - name: Registros del contenedor si algo fallo
        if: failure()
        run: docker logs web || true
