<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>VSD Health</title>
    <meta
      name="description"
      content="Acompañamiento del bienestar emocional y cognitivo. No diagnostica ni reemplaza la atención profesional."
    />

    <!-- El color de la barra del navegador acompana al tema del sistema. -->
    <meta name="theme-color" content="#f7f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />

    <!--
      Manrope es la alternativa libre mas cercana a la tipografia de la
      referencia: geometrica y humanista a la vez, con el mismo comportamiento
      al apretarle el interletrado en tamanos grandes.

      Si no hay red, la cadena de respaldo deja la tipografia del sistema y la
      pagina sigue entera. Por eso los pesos se piden en una sola peticion y
      con `display=swap`: el texto se ve desde el primer instante.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;800&family=DM+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Para instalarla en la pantalla de inicio (SCRUM-102). En iPhone, los
      avisos solo llegan a una aplicacion instalada.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      iOS no lee los iconos del manifiesto: sin estas etiquetas, al agregar la
      app a la pantalla de inicio inventa un icono con la inicial ("V") o usa
      una captura (SCRUM-110). 180 es el del iPhone; 167 y 152, los del iPad.
      El de 180 sin `sizes` va de respaldo para versiones viejas.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />

    <!-- Instalada: el nombre bajo el icono, sin la barra de Safari, y la barra
         de estado con el color de `theme-color` de cada tema. -->
    <meta name="apple-mobile-web-app-title" content="VSD Health" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!--
      El tema se decide aqui, antes de que se pinte nada.

      Si esperara al JavaScript de la aplicacion, quien tiene el sistema en
      oscuro veria un fogonazo blanco en cada carga, que es justo lo que mas
      molesta de un tema oscuro.

      Es la unica copia de la clave de almacenamiento fuera de `tema.ts`. Va
      duplicada a proposito: importar un modulo aqui llegaria tarde.
    -->
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem('vsd.tema');
          var vale = guardado === 'claro' || guardado === 'oscuro';
          var delSistema = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'oscuro'
            : 'claro';

          document.documentElement.dataset.tema = vale ? guardado : delSistema;
        } catch (error) {
          // En navegacion privada leer puede lanzar. Se queda en claro, que es
          // el valor por defecto de la hoja de estilos.
          document.documentElement.dataset.tema = 'claro';
        }
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <noscript>
      VSD Health necesita JavaScript para funcionar. Si no puedes activarlo y estás pasando por un
      momento difícil, en Colombia puedes marcar 192 y elegir la opción 4, o el 123 si hay riesgo
      inmediato. Las dos líneas son gratuitas y atienden a toda hora.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
